name: Publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # publishConfig.registry in package.json already points to npmjs.org.
      # `npm publish` runs the `prepack` (bob build) lifecycle automatically.
      # --provenance links the package to this repo + workflow run (needs id-token: write).
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-gpr:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@erxes'

      # GitHub Packages requires the package to be scoped to the repo owner.
      # Rewrite the name/registry at CI time only (not committed) so the npm
      # publish above keeps the unscoped `rn-erxes-sdk` name.
      - name: Scope package for GitHub Packages
        run: |
          npm pkg set name=@erxes/rn-erxes-sdk
          npm pkg set publishConfig.registry=https://npm.pkg.github.com

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
